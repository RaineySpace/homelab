services:
  reverse-proxy:
    image: caddy:2.10-alpine
    ports:
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:8080:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        INTERNAL_API_BASE_URL: http://api:3001/api/v1
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATA_DIR: /data
      API_HOST: 0.0.0.0
      API_PORT: 3001
      NODE_ENV: production
      PUBLIC_ORIGIN: ${COMPOSE_PUBLIC_ORIGIN:-http://localhost:8080}
    volumes:
      - family-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  backup:
    image: keinos/sqlite3:latest
    volumes:
      - family-data:/data
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /bin/sh /backup.sh || true
          sleep 86400
        done

volumes:
  family-data:
